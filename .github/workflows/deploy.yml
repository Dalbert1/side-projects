name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── Build OSRS Activity Helper ──
      - name: Install OSRS Activity Helper deps
        run: npm ci
        working-directory: osrs-inv-tracker

      - name: Build OSRS Activity Helper
        run: npm run build
        working-directory: osrs-inv-tracker
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── Build Recipe Box ──
      - name: Install RecipeBox deps
        run: npm ci
        working-directory: recipebox

      - name: Build RecipeBox
        run: npm run build
        working-directory: recipebox
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── Build 918 Lightyears (Three.js space game) ──
      - name: Install 918 Lightyears deps
        run: npm ci
        working-directory: lightyears

      - name: Build 918 Lightyears
        run: npm run build
        working-directory: lightyears

      # ── Dugout Counter and the mini games are single HTML files, no build needed ──

      # ── Not deployed (source kept in repo, intentionally left off GitHub Pages):
      #    partyplug, tulsahomehelp, heelerconstruction, haughhoney, handyrandys,
      #    resume-web-app, austinalbert, ww3electricboogaloo, games/battleship.html ──

      # ── Merge all builds into one deploy folder ──
      - name: Assemble site
        run: |
          mkdir -p _site/games
          cp -r osrs-inv-tracker/dist _site/osrs-inv-tracker
          cp -r recipebox/dist _site/recipebox
          cp -r lightyears/dist _site/lightyears
          mkdir -p _site/dugoutcounter
          cp dugoutcounter/index.html _site/dugoutcounter/index.html
          cp games/ninja.html games/cowboy.html games/snake.html _site/games/
          cp index.html _site/index.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
